false,"text":"해밀턴이 십계명의 지속적인 금지 명령에서 분석하는 대표적인 히브리어 구문은 ________이다.","blankCount":1},{"id":219,"set":9,"page":28,"difficulty":"상","star":false,"paper":false,"text":"해밀턴이 소개하는 멘덴홀의 구분에서 언약이 새로운 관계를 세운다면, 율법은 ________과 지속을 목적으로 한다.","blankCount":1},{"id":220,"set":9,"page":28,"difficulty":"상","star":false,"paper":false,"text":"해밀턴이 첫째 계명과 둘째 계명을 구분하여 설명하는 두 관점은 ________이다.","blankCount":1},{"id":221,"set":9,"page":28,"difficulty":"상","star":false,"paper":false,"text":"안식일 계명의 근거를 비교하면 출애굽기 20장은 세계의 창조를, 신명기 5장은 백성의 해방을 제시한다. 이를 묶는 두 주제는 ________이다.","blankCount":1},{"id":222,"set":9,"page":28,"difficulty":"상","star":false,"paper":false,"text":"결의법에서 위반이나 법적 상황의 조건을 제시하는 ‘만일 … 하면’ 부분은 ________이다.","blankCount":1},{"id":223,"set":9,"page":28,"difficulty":"상","star":false,"paper":false,"text":"결의법에서 앞서 제시한 조건에 따르는 보상이나 법적 결과를 말하는 부분은 ________이다.","blankCount":1},{"id":224,"set":9,"page":28,"difficulty":"최상","star":false,"paper":false,"text":"해밀턴은 사람을 받아 죽인 소의 처리 등에서 다른 법전들과 비교하여, 성경 법이 강조하는 ________를 설명한다.","blankCount":1},{"id":225,"set":9,"page":28,"difficulty":"상","star":false,"paper":false,"text":"웬함은 법정에서 직접 처벌하기 어려운 ________까지 십계명이 다루므로, 십계명은 단순한 법조문 이상이라고 설명한다.","blankCount":1},{"id":226,"set":9,"page":28,"difficulty":"최상","star":false,"paper":false,"text":"웬함은 동해복수법이 끝없는 복수를 요구하는 법이 아니라, 피해에 상응하는 ________를 제한하는 법이라고 설명한다.","blankCount":1},{"id":227,"set":10,"page":29,"difficulty":"상","star":false,"paper":false,"text":"출애굽기 32–34장의 금송아지 사건은 성막에 관한 ________ 사이에 놓여, 하나님의 뜻과 백성의 실패를 대조한다.","blankCount":1},{"id":228,"set":10,"page":29,"difficulty":"상","star":true,"paper":false,"text":"교수님은 금송아지 사건을 단순히 다른 종교의 신을 선택한 일로만 설명하지 않고, 구원하신 하나님의 정체성을 사람이 만든 형상에 입힌 ________로 설명하셨다.","blankCount":1},{"id":229,"set":10,"page":29,"difficulty":"상","star":false,"paper":false,"text":"모세가 돌판을 깨뜨린 행위는 단순한 분노 표출을 넘어, 백성의 ________를 드러내는 상징적 행위로 읽을 수 있다.","blankCount":1},{"id":230,"set":10,"page":29,"difficulty":"상","star":true,"paper":false,"text":"교수님은 성막의 그룹과 거룩한 공간, 하나님과의 만남을 타락으로 잃 xt":"해밀턴은 성막의 모든 고리와 색깔에서 숨겨진 뜻을 찾아내는 ________를 주석보다 공상에 가까운 것으로 경계한다.","blankCount":1},{"id":243,"set":10,"page":31,"difficulty":"상","star":false,"paper":false,"text":"해밀턴은 ‘봄·완성·마침·축복’의 대응을 통해 성막 완성 기사와 창세기의 ________ 기사를 연결한다.","blankCount":1},{"id":244,"set":10,"page":31,"difficulty":"상","star":false,"paper":false,"text":"해밀턴은 시내산의 구름과 영광이 성막에서 지속되는 것을 ________, 모세의 접근 제한이 더 강해지는것을 ________, 산에서 맺은 관계가 백성 가운데 거하심으로 이어지는 것을 ________으로 설명한다.","blankCount":3},{"id":245,"set":10,"page":31,"difficulty":"상","star":false,"paper":false,"text":"해밀턴은 모세의 중보가 백성의 회개를 먼저 증명하는 방식이 아니라, 하나님의 ________에 호소한다고 설명한다.","blankCount":1},{"id":246,"set":10,"page":31,"difficulty":"상","star":false,"paper":false,"text":"웬함은 모세가 가져온 두 번째 돌판을 금송아지 뒤 이루어진 ________의 표지로 읽는다.","blankCount":1},{"id":247,"set":10,"page":31,"difficulty":"상","star":false,"paper":false,"text":"웬함은 지성소를 보좌의 방으로 하는 성막을 ________에 비유하며, 여호와가 이스라엘 가운데 거하시는 왕임을 설명한다.","blankCount":1},{"id":248,"set":10,"page":31,"difficulty":"상","star":false,"paper":false,"text":"웬함은 제사장이 백성 앞에서 하나님을, 하나님 앞에서 백성을 나타낸다는 ________ 역할을 설명한다.","blankCount":1},{"id":249,"set":10,"page":31,"difficulty":"상","star":false,"paper":true,"text":"[박철현] 박철현은 출애굽기 24:12-40:38을 따로 떨어진 자료들의 집합보다, 본문의 의미가 이어지는하나의 ________로 읽을 수 있다고 논증한다.","blankCount":1},{"id":250,"set":10,"page":31,"difficulty":"최상","star":false,"paper":true,"text":"[박철현] 박철현은 성막 이야기와 ________ 이야기가 서로 얽혀 하나의 이야기를 이룬다고 본다. 이 독법은 두 이야기를 P와 기타 문서로 떼어 놓는 분석을 비판하는 근거가 된다.","blankCount":1}],"answers":{"1":[11],"2":[10],"3":[8],"4":[3],"5":[4],"6":[6,14,2,7],"7":[1],"8":[13,9],"9":[5],"10":[4],"11":[6],"12":[8],"13":[9],"14":[2],"15":[3],"16":[1],"17":[1],"18":[5],"19":[8],"20":[2],"21":[9],"22":[7],"23":[3],"24":[10],"25":[3],"26":[11],"27":[2],"28":[9],"29":[8],"30":[7],"31":[6],"32":[5],"33":[1],"34":[8],"35":[3,15],"36":[6,2,5],"37":[16],"38":[4],"39":[10],"40":[14],"41":[11],"42":[13,12],"43":[1,3,2],"44":[6],"45":[5],"46":[9,14],"47":[4],"48":[10],"49":[15],"50":[7],"51":[11],"52":[2,13], ,"13":"분석 기준을 소개하는 문제이며 그 타당성을 자동 인정하는 것은 아닙니다.","14":"이 견해를 교수님이나 웬함의 직접 발언으로 바꾸지 않습니다.","15":"관찰된 현상과 그것을 설명하는 가설을 구별합니다.","16":"논문의 내적 증언 논증은 오경 자체, 구약의 다른 책들, 신약이라는 세 범주로 구성됩니다.","17":"출17:14는 모세에게 기록하라는 명령, 출24:4는 모세가 여호와의 말씀을 기록했다는 진술입니다. 이 구절들의 직접 범위와 오 경 전체 저작권에 대한 종합 논증은 구별합니다.","18":"저술 이후의 일부 표현 보충 가능성과 오경 전체의 저자를 후대로 돌리는 주장은 같지 않습니다. 후대 첨가 가능성은 논문이 이 미 앞선 모세 저작권 옹호자들의 설명으로 소개하는 내용입니다.","19":"이집트·아카드·우가릿·시내 반도 등의 기록 자료를 들어 문자 사용 자체가 불가능했다는 전제를 비판합니다.","20":"이것은 박철현이 제시하는 반박의 논리입니다. 본문에 왕이 언급된다는 관찰만으로 기록 시기가 왕정 이후라고 자동 확정하지 않습니다.","21":"두 명칭이 함께 사용되는 현상을 지적합니다. 논문이 소개하는 문서설 학자들은 편집자를 가정하기도 하지만, 박철현은 그것이 신명 기준의 문제를 드러낸다고 봅니다.","22":"다른 종류의 호칭을 함께 쓰는 일이 곧 서로 다른 저자를 뜻하지는 않는다는 반박입니다.","23":"논문은 구속사의 중요한 사건을 겪으며 여호와 이름이 새롭게 알려지는 의미를 듀언 개레트의 논의와 연결합니다. 김대웅 교수 님의 모세 서술 언어 설명과는 구별합니다.","24":"동일한 저자 내부의 변화를 고려하지 않고 모든 차이를 자료 분리의 증거로 삼는 일을 비판합니다.","25":"본문 차이 자체만이 아니라, 어떤 차이를 어느 경우에 자료 분리의 근거로 삼는지를 문제 삼습니다.","26":"창6:20의 일반적 동물 지시와 창7:2의 정결·부정 동물에 대한 구체적 지시를 구분합니다. 박철현은 이를 모순보다 서술 전략으 로 봅니다.","27":"유사한 이야기 형식을 통해 인물의 성품과 서사의 흐름을 드러낼 수 있다는 설명입니다. 반복이 곧 중복 자료 편집의 증거라는 추론을 비판합니다.","28":"본문의 반복이 앞으로 진행하는 서사에서 수행하는 기능을 먼저 살피도록 합니다.","29":"문서별 일관성을 전제하면서 최종 오경의 통일성 가능성은 처음부터 배제하는 점을 비판합니다.","30":"한 학자가 세운 구분이 다른 학자와 일치하지 않는다는 문제입니다. 자료 분리 결과의 차이만으로 모세 저작권이 직접 증명되 었다고 말하는 것은 아닙니다.","31":"이것은 논문에서 제시한 당시 학계에 대한 저자의 진단입니다. 현재 학계 전체의 합의를 뜻하는 진술로 확대하지 않습니다.","32":"성경 권위를 전제하지 않는 상대에게도 본문이 의미 있는 하나의 작품임을 논증할 수 있다고 봅니다. 모세 저작권을 단순히 주 장하는 것과 구별합니다.","33":"통일성만으로 저자의 이름과 연대가 곧바로 확정된다는 뜻이 아닙니다. 저자는 통일성이 기존 문서 분리 논증의 토대를 흔들며, 일부 본문의 고대성 논증을 전체로 확장하는 데 도움이 된다고 봅니다.","36":"환경의 마련과 그 공간을 채우는 피조물의 창조가 대응합니다.","42":"창조 기사들의 강조 차이를 곧 서로 모순되는 하나님으로 처리하지 않습니다.","43":"해밀턴이 소개한 견해들과 저자가 선호하는 해석을 구분하십시오. 교수님의 설명은 별도 비교 문항에서 확인합니다.","44":"하나님의 대리인이라는 지위가 소수 지배자에게만 주어지지 않습니다.","45":"생태계 착취를 정당화하는 해석과 구별됩니다.","46":"교재가 소개한 선택지와 교수님의 독자적 설명을 같은 문장으로 합치지 않습니다.","47":"같은 자음의 다른 어근까지 모두 같은 뜻이라고 확대하지 않습니다.","48":"어휘의 의미와 문맥·신학의 결론을 구분하는 문제입니다.","49":"연계형 가능성을 언급한 사실과 저자의 최종 기울기를 구별하십시오.","50":"모든 지식이나 도덕적 분별 자체가 악하다는 뜻은 아닙니다.","51":"돕는 역할을 곧 존재적 열등함으로 바꾸지 않습니다.","52":"교수님의 설명을 묻는 문항입니다.","54":"절정과 목적이라는 표현을 구분하십시오.","58":"아담과 그리스도의 대표성을 연결한 강의의 설명입니다.","65":"해밀턴 본인의 독창적 주장이라고 잘못 귀속시키지 않습니다.","66":"강의에서도 직접 쓰여 있지 않은 설명이라는 점을 인정하셨습니다.","68":"견해가 다른 경우 문항의 기준이 누구인지 먼저 확인하십시오.","69":"학자의 제안과 본문이 직접 서술한 사건은 다릅니다.","73":"창세기 1장의 모티브가 다시 사용됩니다.","74":"지구라트의 종교적 자부심과 창세기의 풍자를 구별합니다.","77":"곡식 제물의 허용은 가인의 거절 이유를 제물 재료 하나로 단정하지 못하게 합니다.","78":"홍수는 구원 이전에 창조 질서의 해체를 보여 줍니다.","79":"죄의 성격과 심판의 성격 사이의 연결을 묻습니다.","80":"창조의 인간론이 홍수 이후 윤리와 연결됩니다.","81":"하나의 언어는 건축을 가능하게 했고, 흩어짐을 면하려는 의도가 심판받았습니다.","82":"인구의 소음이라는 비교 문헌의 이유와 다릅니다.","83":"창세기 원역사의 신약 사용 가운데 하나입니다.","84":"순종의 행위와 약속의 재확증이라는 연결입니다.","88":"쪼갠 제물 사이를 하나님이 지나가신다는 본문의 행동과 그에 대한 교수님의 언약적 해석입니다.","89":"교수님은 언약 위반의 죽음과 언약주의 책임을 강조하셨습니다.","90":"몸의 표징과 언약의 정체성이 연결됩니다.","93":"같은 구절도 서로 다른 논증 목적에 사용됩니다.","95":"예배자의 자기 봉헌과 대체 제물이라는 원리를 연결합니다.","96":"칭의와 성화를 구별하면서도 살아 있는 믿음의 삶을 분리하지 않는 강의의 설명입니다.","97":"창세기 22:1에는 시험이라는 표현이 직접 나타납니다.","98":"본문의 원어와 문맥적 번역을 구별하는 문제입니다.","99":"본문 사이의 모형적 해석과 명시적 언급 여부는 동일한 질문이 아닙니다.","100":"반복 속의 변화까지 읽어야 합니다.","101":"아브라함의 경험과 이스라엘 공동체의 경험을 연결합니다.","102":"단순히 단어가 비슷한 모든 경우를 모형이라고 확정하지 않습니다.","103":"할례를 약속을 얻어 내는 선행 공로로 바꾸지 않습니다.","104":"출산 가능성이 사라진 몸과 하나님의 생명 주시는 능력을 연결합니다.","105":"전체 창세기와 오경의 전개를 설명하는 요약입니다.","106":"원역사와 족장사를 이어 주는 신학적 연결입니다.","107":"가족과 후손 약속이 구조의 가운데 놓입니다.","114":"창48:15의 고백을 평생의 양육과 큰 자의 섬김을 배우는 일로 연결한 강의의 해석입니다.","116":"교수님이 비판한 초점을 비교하며, 해밀턴이 성장을 전혀 논하지 않는다고 확대하지 않습니다.","117":"비판의 대상과 교재의 실제 범위를 구별하는 확인 문제입니다.","118":"족장들의 힘만으로 해결되지 않는 문제가 반복됩니다.","119":"약속은 인물의 구체적 상황에서 주어집니다.","120":"야곱이 선택되었다는 사실이 가족의 수단을 자동으로 정당화하지 않습니다.","121":"강한 자가 되어 굴복시키기보다 매달려 복을 구하는 모습에 주목합니다.","122":"그가 야곱을 처음부터 끝까지 같은 책략가로만 그린다고 요약하지 않습니다.","123":"예배 장소와 그곳에서 만나시는 하나님을 구분합니다.","124":"중심을 향한 배열과 양쪽 대응을 함께 보아야 합니다.","125":"두 이야기 모두 하나님의 개입이 상황을 바꿉니다.","130":"요셉의 풍성한 축복과 왕권의 계보를 구분합니다.","133":"교수님의 고유 해석을 교재 저자들의 동일한 주장으로 돌리지 않습니다.","134":"꿈의 출처에 대한 저자의 판단과 소개된 여러 가능성을 구분하십시오.","135":"장면들의 배열을 인물의 상승만으로 단순화하지 않습니다.","136":"임재는 고난이 전혀 없다는 보장이 아닙니다.","137":"무엇을 덧붙이고 생략하는지도 문학적 읽기의 대상입니다.","138":"교수님이 강조한 유다의 대신 책임짐과 함께 비교해 보십시오.","139":"창세기의 약속과 출애굽기의 위협을 연결하는 다리입니다.","140":"본문에서 오난의 행위를 이해하는 배경입니다.","141":"구원이 한 가족의 안전에서 더 넓은 범위로 퍼집니다.","142":"그가 유다 이야기와 요셉 이야기 사이의 모든 연결을 부정하는 것은 아닙니다.","143":"창세기 27장과 37장을 비교합니다.","144":"개인 출세담만으로는 이야기의 마지막 관심을 설명할 수 없습니다.","150":"교수님은 출2장의 행위를 행7장과 히11장의 모세 이해와 함께 읽으셨습니다.","151":"대명사의 대상 등 본문의 난점은 별도로 남아 있습니다.","157":"해밀턴의 소개와 교수님의 모세 저작 관점은 구별합니다.","158":"이름의 네 자음 표기와 고대의 정확한 모음 재구성은 다른 문제입니다.","159":"한 지도자의 생애와 그 공동체의 역사가 나란히 전개됩니다.","160":"새 책의 시작이 앞선 책의 약속을 이어받습니다.","161":"후대의 이름 사용에 관한 웬함의 설명이며 모세 저작 확정과는 다른 논점입니다.","162":"무조건 아무도 섬기지 않는 상태만을 구원의 목표로 보지 않습니다.","163":"출애굽기 2장과 3장의 어휘적 대응입니다.","164":"반대의 제거를 통해 사명의 내용도 분명해집니다.","165":"구체적 핑계와 최종적인 불응을 구분합니다.","166":"아브라함 언약과 출애굽기 소명이 연결됩니다.","167":"첫 소명 뒤의 위기가 소명 취소를 뜻하지 않습니다.","176":"노래가 과거 한 사건을 넘어 갖는 의미를 묻습니다.","178":"교재와 교수님의 관계를 모든 대목에서 반대로 처리하지 않습니다.","179":"비판의 핵심은 본문의 구체적 묘사를 충분히 살리는가입니다.","180":"교수님의 비판을 정확히 전하려면 비판받는 교재도 정확히 읽어야 합니다.","181":"구약의 큰 진술과 학자들이 재구성한 세부 연결을 구분하십시오.","182":"그가 소개한 학자의 제안이라는 성격을 기억합니다.","183":"한국어의 한 표현이 원문의 서로 다른 어근을 가릴 수 있습니다.","184":"처음 예고가 언제 나오며 실행 서술이 언제 나오는지를 구별하십시오.","185":"교재들의 구체적인 지리 제안을 섞지 않습니다.","186":"피로 보호받는 사건과 누룩 없는 떡의 절기를 연결합니다.","187":"하나님의 큰 구원과 백성의 신뢰 부족이 대비됩니다.","188":"단순히 열 개를 외우는 것 이상의 구조 문제입니다.","189":"둘째·다섯째·여덟째의 형식과 구분합니다.","190":"이 문항의 보기 표현은 ‘앞선 경고가 없다’는 뜻입니다.","191":"고대의 인간 이해를 구별하는 문제입니다.","192":"문학적 혼합을 곧 서투른 편집이라고 단정하지 않습니다.","196":"십계명과 그 뒤의 구체적 사례들을 구별합니다.","198":"순종 요구에 앞서 있는 하나님의 행동을 주목합니다.","200":"선택은 하나님과 열국을 향한 사명을 포함합니다.","203":"기본 정답은 경외입니다. 하나님 경외와 순종의 관계를 묻습니다.","206":"인간 권위에 대한 공경이 하나님을 거역하는 명령에 복종할 의무로 바뀌지는 않는다는 강의의 설명입니다.","207":"사례법에 규정되었다는 이유만으로 그 상태를 이상이라고 승인하지 않습니다.","208":"인간의 권위를 하나님의 권위와 동일시하는 것은 아닙니다.","210":"언약주가 백성의 책임을 감당하신다는 교수님의 언약적·그리스도론적 연결입니다.","211":"신뢰의 훈련과 하나님의 신실하심을 의심하는 행위를 구별합니다.","212":"비축 능력보다 공급하시는 분을 의뢰하도록 훈련받습니다.","213":"안식일 명령과 일용할 양식 명령을 함께 읽습니다.","214":"돌보심과 율 const STORAGE='pentateuch_study_v250_paper_v1';
const qmap=Object.fromEntries(DB.questions.map(q=>[q.id,q]));
const smap=Object.fromEntries(DB.sets.map(s=>[s.id,s]));
const pmap=Object.fromEntries(DB.pages.map(p=>[p.id,p]));
const DEFAULT={history:[],review:{},bookmarks:[],session:null,lastResult:null};
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');return x&&typeof x==='object'?{...DEFAULT,...x}:structuredClone(DEFAULT)}catch(e){return {history:[],review:{},bookmarks:[],session:null,lastResult:null}}}
let state=load(),screen='home',currentIndex=0,activeBlank=0,reviewFilter='wrong';
const view=document.getElementById('view');
const el=(s)=>document.querySelector(s);
const h=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
let toastTimeout;function toast(s){const t=el('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.add('hidden'),2200)}
function wrongIds(){return Object.entries(state.review).filter(([id,r])=>r.lastWrong).map(([id])=>Number(id)).sort((a,b)=>a-b)}
function attemptedIds(){return Object.keys(state.review).length}
function correctCount(){return Object.values(state.review).filter(r=>!r.lastWrong).length}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseMode(mode){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===mode));document.getElementById('sideWrong').textContent=wrongIds().length;document.getElementById('sideBookmark').textContent=state.bookmarks.length;document.getElementById('breadcrumb').innerHTML=`오경 스터디 <strong>/ ${h(mode==='quiz'?'문제 풀기':mode==='result'?'결과':mode==='wrong'?'오답노트':mode==='bookmarks'?'찜한 문제':'학습 현황')}</strong>`;}
function sidebar(){document.getElementById('sideSets').innerHTML=DB.sets.map(s=>`<button class="nav-btn" data-side-set="${s.id}"><span class="glyph" style="font-size:12px">${pad(s.id)}</span><span style="font-size:12px">${h(s.title)}</span></button>`).join('')}
function stats(){let total=attemptedIds();let right=correctCount();return `<div class="stat-grid"><div class="stat"><div class="stat-num">250<span style="font-size:15px;color:#8aa0aa">문항</span></div><div class="stat-label">전체 문제 수</div></div><div class="stat"><div class="stat-num">${total}<span style="font-size:15px;color:#8aa0aa"> / 250</span></div><div class="stat-label">풀이 경험 문항</div></div><div class="stat"><div class="stat-num">${total?Math.round(right/total*100):0}<span style="font-size:18px">%</span></div><div class="stat-label">최근 풀이 기준 정답률</div></div><div class="stat"><div class="stat-num">${wrongIds().length}</div><div class="stat-label">복습할 오답</div></div></div>`}
function setupHtml(selected='all',mode='practice'){return `<div class="setup-box" id="setup"><div class="setup-grid"><div class="field"><label for="unit">학습 범위</label><select id="unit"><option value="all">전체 범위 (1–250번)</option>${DB.sets.map(s=>`<option value="${s.id}" ${selected==s.id?'selected':''}>${pad(s.id)} · ${h(s.title)}</option>`).join('')}</select></div><div class="field"><label for="difficulty">난이도</label><select id="difficulty"><option value="all">전체 난이도</option><option value="중">중</option><option value="상">상</option><option value="최상">최상</option></select></div><div class="field"><label for="amount">출제 문항</label><select id="amount"><option value="10">10문항</option><option value="20" ${selected!='all'?'selected':''}>20문항</option><option value="40">40문항</option><option value="all" ${selected=='all'?'selected':''}>조건에 맞는 전체</option></select></div></div><div class="switch-row"><label class="switch"><input type="checkbox" id="starOnly">★ 교수님 강조 문항만</label><label class="switch"><input type="checkbox" id="paperOnly">박철현 논문 20문항만</label><label class="switch"><input type="checkbox" id="random" ${selected=='all'||mode==='exam'?'checked':''}>문항 순서 섞기</label></div><div class="setup-actions"><span class="helper">${mode==='exam'?'모의고사에서는 제출 전 정답이 표시되지 않습니다.':'학습 모드에서는 각 문항별로 정답을 확인할 수 있습니다.'}</span><button class="btn btn-primary" data-action="start-${mode}">${mode==='exam'?'모의고사 시작':'학습 시작'} →</button></div></div>`}
function home(selected='all',mode='practice'){
 screen='home';chooseMode(mode==='exam'?'exam':'home');const greeting=mode==='exam'?'실전처럼 풀어보세요':'오경, 체계적으로 복습하세요';
 view.innerHTML=`<div class="hero"><div class="eyebrow" style="color:#91ddd0">PENTATEUCH / STUDY WORKBOOK</div><h1>${greeting}</h1><p>창세기부터 출애굽기까지, 강의 교정본·빅터 해밀턴·고든 웬함·박철현 논문을 바탕으로 개정한 250문항을 풀어보세요. 페이지별 보기 선택과 정답·해설집 기준 자동 채점으로 부족한 개념을 찾아 복습합니다.</p><div class="hero-actions"><button class="btn btn-cream" data-action="scroll-setup">${mode==='exam'?'모의고사 설정':'문제 풀기'} ↗</button><button class="btn btn-outline" data-action="wrong-screen">오답 복습 ${wrongIds().length}문항</button><button class="btn btn-cream" data-action="paper-start">박철현 논문 20문항만 풀기 ↗</button></div></div>${stats()}<div class="section-head" id="setupSection"><div><h2>${mode==='exam'?'모의고사 설정':'새 학습 시작'}</h2><p>문제집 각 페이지의 보기를 사용합니다. 정답 확인 시 정답·해설집에 기재된 출처와 해설을 함께 표시합니다.</p></div></div>${setupHtml(selected,mode)}${state.session?`<div class="session-resume"><div><strong>진행 중인 학습이 있습니다.</strong><br><span>${state.session.ids.length}문항 · ${state.session.mode==='exam'?'모의고사':'단원별 학습'} · 답안이 저장되어 있습니다.</span></div><button class="btn btn-primary btn-small" data-action="resume">이어서 풀기 →</button></div>`:''}<div class="section-head"><div><h2>단원별 학습</h2><p>원본 문제집의 구성과 문항 번호를 그대로 유지했습니다.</p></div></div><div class="set-grid">${DB.sets.map(s=>{const all=DB.questions.filter(q=>q.set===s.id), reviewed=Object.keys(state.review).filter(n=>qmap[n]?.set===s.id).length;return `<button class="set-card" data-set="${s.id}"><div><div class="set-no">SET ${pad(s.id)} · ${all[0].id}–${all[all.length-1].id}번</div><div class="set-title">${h(s.title)}</div><div class="set-caption">${reviewed}/${all.length}문항 학습 경험 · 보기 묶음 ${DB.pages.filter(p=>p.set===s.id).length}개</div></div><div class="card-arrow">↗</div></button>`}).join('')}</div><div class="privacy">원본 안내: 실제 기출문제가 아닌 학습용 연습문제입니다. 교수님 강의·해밀턴·웬함·박철현 논문의 견해를 구분합니다. [박철현] 직접 출제 20문항이 포함되어 있습니다.<br>풀이 기록은 현재 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지 않습니다. <button class="reset-link" data-action="reset">학습 기록 초기화</button></div>`;
}
function sessionQs(){return state.session.ids.map(n=>qmap[n])}
function questionAt(){return qmap[state.session.ids[currentIndex]]}
function optText(q,n){return pmap[q.page].options.find(o=>o.id===n)?.text||`[${pad(n)}]`}
function formatAns(q,arr){return arr.map(id=>optText(q,id)).join(' → ')}
function userAns(q){return state.session.responses[q.id]||Array(q.blankCount).fill(null)}
function isCorrect(q,answer){const expected=DB.answers[q.id];return expected.length===answer.length&&expected.every((v,i)=>v===answer[i])}
function numAnswered(q){return userAns(q).filter(x=>x!==null&&x!==undefined).length}
function completed(q){return numAnswered(q)===q.blankCount}
function progressCounts(){return sessionQs().filter(completed).length}
function answerText(q){return formatAns(q,DB.answers[q.id])}
function sourceMarkup(q){return `<div class="source-note"><strong>출처</strong> ${h(DB.sources[q.id]||'정답·해설집')} <span class="pdf-ref">(문제집 ${q.page}쪽)</span></div>`}
function renderQuestion(){
 if(!state.session)return home();screen='quiz';chooseMode('quiz');const qs=sessionQs(),q=questionAt(),ans=userAns(q),set=smap[q.set],page=pmap[q.page],graded=state.session.checked[q.id],exam=state.session.mode==='exam';if(activeBlank>=q.blankCount)activeBlank=0;
 const fragments=q.text.split('________');
 const stmt=fragments.map((frag,i)=>h(frag)+(i<q.blankCount?`<button type="button" class="blank ${i===activeBlank?'active ':''}${ans[i]!=null?'filled':''}${ans[i]==null?' noanswer':''}" data-blank="${i}" aria-label="${i+1}번 빈칸${ans[i]?' '+optText(q,ans[i]):''}">${ans[i]!=null?h(optText(q,ans[i])):'빈칸 '+(i+1)}</button>`:'')).join('');
 let feedback='';if(graded&&!exam){const ok=isCorrect(q,ans);feedback=`<div class="feedback ${ok?'':'wrong'}" role="status"><div class="feedback-title">${ok?'✓ 정답입니다.':'✕ 다시 확인해 보세요.'}</div><div class="feedback-body">정답: <strong>${h(answerText(q))}</strong></div>${DB.notes[q.id]?`<div class="feedback-note">${h(DB.notes[q.id])}</div>`:''}${sourceMarkup(q)}</div>`}
 let count=progressCounts(),filled=Math.round(count/qs.length*100);
 view.innerHTML=`<div class="quiz-head"><div class="quiz-head-top"><span class="smallmuted">${exam?'EXAM MODE · 실전 모의고사':'STUDY MODE · 단원별 학습'}</span><span class="smallmuted" style="font-weight:800">${currentIndex+1} / ${qs.length}문항</span></div><h2 class="quiz-heading">${h(set.title)}</h2><div class="smallmuted">${count}문항 답안 완성 · ${qs.length-count}문항 남음</div><div class="progress-track"><div class="progress-fill" style="width:${filled}%"></div></div></div><div class="quiz-layout"><section class="question-panel"><div class="question-meta"><span class="q-num">Q${pad(q.id)}</span><span class="badge ${q.difficulty==='중'?'mid':q.difficulty==='상'?'hard':'vhard'}">${h(q.difficulty)} 난이도</span>${q.star?'<span class="badge star">★ 교수님 강조</span>':''}${q.paper?'<span class="badge paper">박철현 논문</span>':''}<span class="badge">단원 ${pad(q.set)}</span><span class="badge">PDF p.${q.page}</span><button class="star-toggle ${state.bookmarks.includes(q.id)?'on':''}" title="복습 문제 찜하기" data-action="bookmark">${state.bookmarks.includes(q.id)?'★ 찜 완료':'☆ 찜하기'}</button></div><div class="question-text">${stmt}</div><p class="bank-guide">${q.blankCount>1?`빈칸이 ${q.blankCount}개입니다. 채울 칸을 클릭한 다음 보기에서 답을 선택하세요.`:'보기에서 정답을 클릭하면 빈칸에 입력됩니다.'} 빈칸을 다시 클릭하면 입력을 지울 수 있습니다.</p><div class="divider"></div><div class="bank-title">보기 <span class="smallmuted">${page.options.length}개 · 중복 선택 가능</span></div><div class="bank-guide">원본 문제집 ${q.page}쪽(${page.start}–${page.end}번)의 보기만 사용합니다. 번호는 페이지마다 새로 시작하고, 반복 선택할 수 있습니다.</div><div class="option-grid">${page.options.map(o=>`<button type="button" class="opt ${ans.includes(o.id)?'used':''}" data-option="${o.id}"><span class="opt-no">${pad(o.id)}</span><span>${h(o.text)}</span></button>`).join('')}</div>${feedback}<div class="action-row"><button class="btn btn-outline" data-action="prev" ${currentIndex===0?'disabled':''}>← 이전 문제</button><div class="right">${exam?'':`<button class="btn btn-outline" data-action="check" ${!completed(q)?'disabled':''}>정답 확인</button>`}<button class="btn btn-primary" data-action="next">${currentIndex===qs.length-1?'마지막 문제':'다음 문제 →'}</button></div></div></section><aside class="navigator"><div class="nav-panel-title">문제 이동</div><div class="nav-panel-sub">번호를 클릭하면 해당 문제로 이동합니다. 전체 문항이 많으면 안쪽을 스크롤하세요.</div><div class="question-palette">${qs.map((item,i)=>`<button class="pbutton ${i===currentIndex?'current':''} ${completed(item)?'answered':''} ${state.bookmarks.includes(item.id)?'flagged':''}" data-index="${i}" aria-label="${item.id}번 문제">${item.id}</button>`).join('')}</div><div class="palette-legend"><span><i class="legend-dot filled"></i>입력 완료</span><span><i class="legend-dot flag"></i>찜한 문제</span></div><button class="btn btn-primary" data-action="finish">${exam?'모의고사 제출':'전체 채점 및 결과 보기'}</button><button class="btn btn-outline" data-action="to-home">진행 상태 저장하고 나가기</button><div class="notice-mini">풀이 진행 상태는 자동 저장됩니다. 제출하지 않은 문제는 미응답으로 처리됩니다.</div></aside></div>`;
}
function newSession(ids,mode,description){if(!ids.length){toast('조건에 맞는 문항이 없습니다.');return}if(state.session&&!confirm('기존에 진행 중인 학습을 종료하고 새로 시작할까요?'))return;state.session={ids,mode,description,responses:{},checked:{},startedAt:new Date().toISOString()};currentIndex=0;activeBlank=0;save();renderQuestion();window.scrollTo({top:0,behavior:'instant'})}
function startFromSetup(mode){const unit=el('#unit')?.value||'all',diff=el('#difficulty')?.value||'all',amount=el('#amount')?.value||'20',stars=!!el('#starOnly')?.checked,paperOnly=!!el('#paperOnly')?.checked,random=!!el('#random')?.checked;let qs=DB.questions.filter(q=>(unit==='all'||q.set===Number(unit))&&(diff==='all'||q.difficulty===diff)&&(!stars||q.star)&&(!paperOnly||q.paper));if(random)qs=shuffle(qs);const ids=(amount==='all'?qs:qs.slice(0,Number(amount))).map(q=>q.id);const desc=(paperOnly?'박철현 논문 문항 · ':'')+(unit==='all'?'전체 범위':smap[Number(unit)].title);newSession(ids,mode,desc)}
function setBlank(i){const q=questionAt();let arr=userAns(q).slice();activeBlank=i;if(arr[i]!=null){arr[i]=null;state.session.responses[q.id]=arr;delete state.session.checked[q.id];save()}renderQuestion()}
function chooseOption(id){const q=questionAt();let arr=userAns(q).slice();arr[activeBlank]=id;state.session.responses[q.id]=arr;delete state.session.checked[q.id];let ix=arr.findIndex(x=>x==null);if(ix>=0)activeBlank=ix;else activeBlank=Math.min(q.blankCount-1,activeBlank+1);save();renderQuestion()}
function checkCurrent(){let q=questionAt();if(!completed(q)){toast('빈칸을 모두 채워 주세요.');return}state.session.checked[q.id]=true;save();renderQuestion()}
function finish(){const qs=sessionQs(),count=qs.filter(completed).length,unanswered=qs.length-count;if(unanswered&&!confirm(`아직 ${unanswered}문항의 답안이 완성되지 않았습니다. 미응답을 오답 처리하고 제출할까요?`))return;const sess=state.session;const outcomes=qs.map(q=>{const answer=userAns(q);const ok=completed(q)&&isCorrect(q,answer);const old=state.review[q.id]||{attempts:0,correct:0};state.review[q.id]={attempts:old.attempts+1,correct:old.correct+(ok?1:0),lastWrong:!ok};return{id:q.id,user:answer,correct:ok}});const correct=outcomes.filter(o=>o.correct).length;const result={ids:sess.ids,mode:sess.mode,description:sess.description,outcomes,correct,finishedAt:new Date().toISOString()};state.history.unshift({count:qs.length,correct,at:result.finishedAt,mode:sess.mode});state.history=state.history.slice(0,50);state.lastResult=result;state.session=null;save();showResult();window.scrollTo({top:0,behavior:'instant'})}
function resultItem(o,withMy=true){const q=qmap[o.id],answers=h(answerText(q));let mine=o.user.filter(x=>x!=null).length?o.user.map(v=>v==null?'(미입력)':optText(q,v)).join(' → '):'(미응답)';return `<div class="review-item"><div class="review-title"><span class="badge ${o.correct===null?'':o.correct?'mid':'vhard'}">${o.correct===null?'찜한 문제':o.correct?'정답':'오답'}</span> <span>${q.id}번 · ${h(smap[q.set].title)}</span> ${q.star?'<span style="color:#ac7d29">★</span>':''}${q.paper?'<span class="badge paper">박철현 논문</span>':''}</div><div class="review-statement">${h(q.text)}</div><div class="review-answers"><div class="answer">정답 · ${answers}</div>${withMy?`<div class="mine">내 답 · ${h(mine)}</div>`:''}</div>${DB.notes[q.id]?`<div class="feedback-note">${h(DB.notes[q.id])}</div>`:''}${sourceMarkup(q)}</div>`}
function showResult(){screen='result';chooseMode('result');const r=state.lastResult;if(!r){return home()}const pct=Math.round(r.correct/r.ids.length*100);const items=r.outcomes.filter(o=>reviewFilter==='all'||!o.correct);view.innerHTML=`<div class="result-hero"><div><div class="eyebrow" style="color:#afe3d7">STUDY REPORT</div><h1 style="font-size:26px;margin-bottom:8px">채점이 완료되었습니다</h1><div class="result-score">${r.correct}<span> / ${r.ids.length}문항</span></div><div class="result-sub">정답률 ${pct}% · 오답 ${r.ids.length-r.correct}문항 · ${h(r.description)}</div></div><div class="result-percent">${pct}%</div></div><div class="result-actions"><button class="btn btn-primary" data-action="restart-wrong" ${!r.outcomes.some(o=>!o.correct)?'disabled':''}>이번 오답 다시 풀기</button><button class="btn btn-outline" data-action="to-home">대시보드로</button><button class="btn btn-outline" data-action="new-exam">새 모의고사</button></div><div class="section-head"><div><h2>문항별 정답 확인</h2><p>업로드한 250문항 정답·해설집 기준으로 채점했습니다.</p></div></div><div class="toggle-filter"><button class="filter-btn ${reviewFilter==='wrong'?'active':''}" data-filter="wrong">오답만 (${r.ids.length-r.correct})</button><button class="filter-btn ${reviewFilter==='all'?'active':''}" data-filter="all">전체 보기 (${r.ids.length})</button></div><div class="review-list">${items.length?items.map(resultItem).join(''):'<div class="empty"><strong>복습할 오답이 없습니다.</strong><br>이번 학습의 모든 문항을 맞혔습니다.</div>'}</div>`}
function showCollection(which){screen=which;chooseMode(which);const ids=which==='wrong'?wrongIds():state.bookmarks.slice().sort((a,b)=>a-b);const title=which==='wrong'?'오답노트':'찜한 문제';view.innerHTML=`<div class="section-head" style="margin-top:2px"><div><div class="eyebrow">PERSONAL STUDY</div><h2>${title}</h2><p>${which==='wrong'?'최근 풀이에서 틀린 문제만 모았습니다. 다시 맞히면 오답 목록에서 사라집니다.':'중요한 문제를 별표로 모아 반복해서 풀 수 있습니다.'}</p></div></div>${ids.length?`<div class="setup-box" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px"><span><strong>${ids.length}문항</strong>이 있습니다.</span><button class="btn btn-primary" data-action="start-${which}">${title} ${ids.length}문항 풀기 →</button></div><div class="review-list">${ids.map(id=>resultItem({id,user:[],correct:which==='wrong'?false:null},false)).join('')}</div>`:`<div class="empty"><strong>${which==='wrong'?'아직 오답이 없습니다.':'아직 찜한 문제가 없습니다.'}</strong><br>${which==='wrong'?'먼저 문제를 풀고 결과를 제출해 주세요.':'문제를 풀면서 ☆ 버튼을 눌러 저장하세요.'}<br><button class="btn btn-primary" style="margin-top:15px" data-action="to-home">문제 풀러 가기 →</button></div>`}`}
function navigate(idx){const n=state.session.ids.length;currentIndex=Math.max(0,Math.min(n-1,idx));activeBlank=0;save();renderQuestion();window.scrollTo({top:0,behavior:'instant'})}
function handleClick(e){const btn=e.target.closest('button');if(!btn)return;const act=btn.dataset.action;
 if(btn.dataset.nav){const n=btn.dataset.nav;if(n==='home'||n==='practice'||n==='exam')home('all',n==='exam'?'exam':'practice');else showCollection(n);return}
 if(btn.dataset.sideSet){home(btn.dataset.sideSet);el('#setupSection')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(btn.dataset.set){home(btn.dataset.set);el('#setupSection')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(btn.dataset.blank!==undefined){setBlank(Number(btn.dataset.blank));return}
 if(btn.dataset.option){chooseOption(Number(btn.dataset.option));return}
 if(btn.dataset.index!==undefined){navigate(Number(btn.dataset.index));return}
 if(btn.dataset.filter){reviewFilter=btn.dataset.filter;showResult();return}
 if(act==='scroll-setup')el('#setupSection')?.scrollIntoView({behavior:'smooth'});
 else if(act==='wrong-screen')showCollection('wrong');
 else if(act==='paper-start')newSession(DB.questions.filter(q=>q.paper).map(q=>q.id),'practice','박철현 논문 직접 출제 20문항');
 else if(act==='start-practice'||act==='start-exam')startFromSetup(act==='start-exam'?'exam':'practice');
 else if(act==='resume'){currentIndex=0;let first=sessionQs().findIndex(q=>!completed(q));if(first>=0)currentIndex=first;renderQuestion()}
 else if(act==='to-home')home();
 else if(act==='prev')navigate(currentIndex-1);
 else if(act==='next'){if(currentIndex<state.session.ids.length-1)navigate(currentIndex+1);else toast('마지막 문제입니다. 완료 후 전체 채점 버튼을 누르세요.')}
 else if(act==='check')checkCurrent();
 else if(act==='finish')finish();
 else if(act==='bookmark'){const id=questionAt().id;if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();renderQuestion()}
 else if(act==='restart-wrong'){const wrong=state.lastResult.outcomes.filter(o=>!o.correct).map(o=>o.id);newSession(wrong,'practice','직전 시험 오답 복습')}
 else if(act==='new-exam')home('all','exam');
 else if(act==='start-wrong'||act==='start-bookmarks'){newSession(act==='start-wrong'?wrongIds():state.bookmarks.slice().sort((a,b)=>a-b),'practice',act==='start-wrong'?'오답 복습':'찜한 문제 복습')}
 else if(act==='reset'){if(confirm('풀이 기록, 오답노트, 찜한 문제를 모두 삭제할까요? 복구할 수 없습니다.')){state={history:[],review:{},bookmarks:[],session:null,lastResult:null};save();home();toast('브라우저의 학습 기록을 초기화했습니다.')}}
}
document.addEventListener('click',handleClick);el('#mobileHome').addEventListener('click',()=>home());document.addEventListener('keydown',e=>{if(screen!=='quiz'||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&currentIndex<state.session.ids.length-1)navigate(currentIndex+1);if(e.key==='ArrowLeft'&&currentIndex>0)navigate(currentIndex-1);if(e.key==='Backspace'&&document.activeElement===document.body){e.preventDefault();setBlank(activeBlank)}});
sidebar();home();
</script>
</body></html>
