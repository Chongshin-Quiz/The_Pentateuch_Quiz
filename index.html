const DEFAULT={history:[],review:{},bookmarks:[],session:null,lastResult:null};
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');return x&&typeof x==='object'?{...DEFAULT,...x}:structuredClone(DEFAULT)}catch(e){return {history:[],review:{},bookmarks:[],session:null,lastResult:null}}}
let state=load(),screen='home',currentIndex=0,activeBlank=0,reviewFilter='wrong';
const view=document.getElementById('view');

let toastTimeout;function toast(s){const t=el('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.add('hidden'),2200)}
function wrongIds(){return Object.entries(state.review).filter(([id,r])=>r.lastWrong).map(([id])=>Number(id)).sort((a,b)=>a-b)}
function attemptedIds(){return Object.keys(state.review).length}
function correctCount(){return Object.values(state.review).filter(r=>!r.lastWrong).length}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseMode(mode){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===mode));document.getElementById('sideWrong').textContent=wrongIds().length;document.getElementById('sideBookmark').textContent=state.bookmarks.length;document.getElementById('breadcrumb').innerHTML=`오경 스터디 <strong>/ ${h(mode==='quiz'?'문제 풀기':mode==='result'?'결과':mode==='wrong'?'오답노트':mode==='bookmarks'?'찜한 문제':'학습 현황')}</strong>`;}

function home(selected='all',mode='practice'){
 screen='home';chooseMode(mode==='exam'?'exam':'home');const greeting=mode==='exam'?'실전처럼 풀어보세요':'오경, 체계적으로 복습하세요';
 view.innerHTML=`<div class="hero"><div class="eyebrow" style="color:#91ddd0">PENTATEUCH / STUDY WORKBOOK</div><h1>${greeting}</h1><p>창세기부터 출애굽기까지, 강의 내용을 토대로 구성된 200문항을 풀어보세요. 단원별 보기 선택과 정답지 기준 자동 채점으로 부족한 개념을 찾아 복습합니다.</p><div class="hero-actions"><button class="btn btn-cream" data-action="scroll-setup">${mode==='exam'?'모의고사 설정':'문제 풀기'} ↗</button><button class="btn btn-outline" data-action="wrong-screen">오답 복습 ${wrongIds().length}문항</button></div></div>${stats()}<div class="section-head" id="setupSection"><div><h2>${mode==='exam'?'모의고사 설정':'새 학습 시작'}</h2><p>PDF에 수록된 보기를 그대로 제시하며, 보기 번호를 선택해 빈칸을 채웁니다.</p></div></div>${setupHtml(selected,mode)}${state.session?`<div class="session-resume"><div><strong>진행 중인 학습이 있습니다.</strong><br><span>${state.session.ids.length}문항 · ${state.session.mode==='exam'?'모의고사':'단원별 학습'} · 답안이 저장되어 있습니다.</span></div><button class="btn btn-primary btn-small" data-action="resume">이어서 풀기 →</button></div>`:''}<div class="section-head"><div><h2>단원별 학습</h2><p>원본 문제집의 구성과 문항 번호를 그대로 유지했습니다.</p></div></div><div class="set-grid">${DB.sets.map(s=>{const reviewed=Object.keys(state.review).filter(n=>qmap[n].set===s.id).length;return `<button class="set-card" data-set="${s.id}"><div><div class="set-no">SET ${pad(s.id)} · ${(s.id-1)*20+1}–${s.id*20}번</div><div class="set-title">${h(s.title)}</div><div class="set-caption">${reviewed}/20문항 학습 경험 · 보기 ${s.options.length}개</div></div><div class="card-arrow">↗</div></button>`}).join('')}</div><div class="privacy">원본 안내: 실제 기출문제가 아닌 학습용 연습문제입니다. 일부 문항은 교수님의 강의 해석을 묻습니다.<br>풀이 기록은 현재 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지 않습니다. <button class="reset-link" data-action="reset">학습 기록 초기화</button></div>`;
}
function sessionQs(){return state.session.ids.map(n=>qmap[n])}
function questionAt(){return qmap[state.session.ids[currentIndex]]}
function optText(q,n){return smap[q.set].options.find(o=>o.id===n)?.text||`[${pad(n)}]`}
function formatAns(q,arr){return arr.map(id=>optText(q,id)).join(' → ')}
function userAns(q){return state.session.responses[q.id]||Array(q.blankCount).fill(null)}
function isCorrect(q,answer){let expected=DB.answers[q.id];let normal=expected.length===answer.length&&expected.every((v,i)=>v===answer[i]);if(normal)return true;if(q.id===43)return answer.length===2&&answer[0]===18&&answer[1]===17;if(q.id===173)return answer.length===1&&answer[0]===7;return false}
function numAnswered(q){return userAns(q).filter(x=>x!==null&&x!==undefined).length}
function completed(q){return numAnswered(q)===q.blankCount}
function progressCounts(){return sessionQs().filter(completed).length}
function answerText(q){const x=DB.answers[q.id];const alt=q.id===43?' (또는 하나 → 둘)':q.id===173?' (또는 하나님께 대한 순종)':'';return formatAns(q,x)+alt}
function renderQuestion(){
 if(!state.session)return home();screen='quiz';chooseMode('quiz');const qs=sessionQs(),q=questionAt(),ans=userAns(q),set=smap[q.set],graded=state.session.checked[q.id],exam=state.session.mode==='exam';if(activeBlank>=q.blankCount)activeBlank=0;
 const fragments=q.text.split('________');
 const stmt=fragments.map((frag,i)=>h(frag)+(i<q.blankCount?`<button type="button" class="blank ${i===activeBlank?'active ':''}${ans[i]!=null?'filled':''}${ans[i]==null?' noanswer':''}" data-blank="${i}" aria-label="${i+1}번 빈칸${ans[i]?' '+optText(q,ans[i]):''}">${ans[i]!=null?h(optText(q,ans[i])):'빈칸 '+(i+1)}</button>`:'')).join('');
 let feedback='';if(graded&&!exam){const ok=isCorrect(q,ans);feedback=`<div class="feedback ${ok?'':'wrong'}" role="status"><div class="feedback-title">${ok?'✓ 정답입니다.':'✕ 다시 확인해 보세요.'}</div><div class="feedback-body">정답: <strong>${h(answerText(q))}</strong></div>${DB.notes[q.id]?`<div class="feedback-note">${h(DB.notes[q.id])}</div>`:''}</div>`}
 let count=progressCounts(),filled=Math.round(count/qs.length*100);
 view.innerHTML=`<div class="quiz-head"><div class="quiz-head-top"><span class="smallmuted">${exam?'EXAM MODE · 실전 모의고사':'STUDY MODE · 단원별 학습'}</span><span class="smallmuted" style="font-weight:800">${currentIndex+1} / ${qs.length}문항</span></div><h2 class="quiz-heading">${h(set.title)}</h2><div class="smallmuted">${count}문항 답안 완성 · ${qs.length-count}문항 남음</div><div class="progress-track"><div class="progress-fill" style="width:${filled}%"></div></div></div><div class="quiz-layout"><section class="question-panel"><div class="question-meta"><span class="q-num">Q${pad(q.id)}</span><span class="badge ${q.difficulty==='중'?'mid':q.difficulty==='상'?'hard':'vhard'}">${h(q.difficulty)} 난이도</span>${q.star?'<span class="badge star">★ 교수님 강조</span>':''}<span class="badge">SET ${pad(q.set)}</span><button class="star-toggle ${state.bookmarks.includes(q.id)?'on':''}" title="복습 문제 찜하기" data-action="bookmark">${state.bookmarks.includes(q.id)?'★ 찜 완료':'☆ 찜하기'}</button></div><div class="question-text">${stmt}</div><p class="bank-guide">${q.blankCount>1?`빈칸이 ${q.blankCount}개입니다. 채울 칸을 클릭한 다음 보기에서 답을 선택하세요.`:'보기에서 정답을 클릭하면 빈칸에 입력됩니다.'} 빈칸을 다시 클릭하면 입력을 지울 수 있습니다.</p><div class="divider"></div><div class="bank-title">보기 <span class="smallmuted">${set.options.length}개 · 중복 선택 가능</span></div><div class="bank-guide">${h(set.title)}의 보기만 사용합니다. 모든 보기가 정답으로 사용되지는 않습니다.</div><div class="option-grid">${set.options.map(o=>`<button type="button" class="opt ${ans.includes(o.id)?'used':''}" data-option="${o.id}"><span class="opt-no">${pad(o.id)}</span><span>${h(o.text)}</span></button>`).join('')}</div>${feedback}<div class="action-row"><button class="btn btn-outline" data-action="prev" ${currentIndex===0?'disabled':''}>← 이전 문제</button><div class="right">${exam?'':`<button class="btn btn-outline" data-action="check" ${!completed(q)?'disabled':''}>정답 확인</button>`}<button class="btn btn-primary" data-action="next">${currentIndex===qs.length-1?'마지막 문제':'다음 문제 →'}</button></div></div></section><aside class="navigator"><div class="nav-panel-title">문제 이동</div><div class="nav-panel-sub">번호를 클릭하면 해당 문제로 이동합니다.</div><div class="question-palette">${qs.map((item,i)=>`<button class="pbutton ${i===currentIndex?'current':''} ${completed(item)?'answered':''} ${state.bookmarks.includes(item.id)?'flagged':''}" data-index="${i}" aria-label="${item.id}번 문제">${item.id}</button>`).join('')}</div><div class="palette-legend"><span><i class="legend-dot filled"></i>입력 완료</span><span><i class="legend-dot flag"></i>찜한 문제</span></div><button class="btn btn-primary" data-action="finish">${exam?'모의고사 제출':'전체 채점 및 결과 보기'}</button><button class="btn btn-outline" data-action="to-home">진행 상태 저장하고 나가기</button><div class="notice-mini">풀이 진행 상태는 자동 저장됩니다. 제출하지 않은 문제는 미응답으로 처리됩니다.</div></aside></div>`;
}
function newSession(ids,mode,description){if(!ids.length){toast('조건에 맞는 문항이 없습니다.');return}if(state.session&&!confirm('기존에 진행 중인 학습을 종료하고 새로 시작할까요?'))return;state.session={ids,mode,description,responses:{},checked:{},startedAt:new Date().toISOString()};currentIndex=0;activeBlank=0;save();renderQuestion();window.scrollTo({top:0,behavior:'instant'})}
function startFromSetup(mode){const unit=el('#unit')?.value||'all',diff=el('#difficulty')?.value||'all',amount=el('#amount')?.value||'20',stars=!!el('#starOnly')?.checked,random=!!el('#random')?.checked;let qs=DB.questions.filter(q=>(unit==='all'||q.set===Number(unit))&&(diff==='all'||q.difficulty===diff)&&(!stars||q.star));if(random)qs=shuffle(qs);const ids=(amount==='all'?qs:qs.slice(0,Number(amount))).map(q=>q.id);const desc=unit==='all'?'전체 범위':smap[Number(unit)].title;newSession(ids,mode,desc)}
function setBlank(i){const q=questionAt();let arr=userAns(q).slice();activeBlank=i;if(arr[i]!=null){arr[i]=null;state.session.responses[q.id]=arr;delete state.session.checked[q.id];save()}renderQuestion()}
function chooseOption(id){const q=questionAt();let arr=userAns(q).slice();arr[activeBlank]=id;state.session.responses[q.id]=arr;delete state.session.checked[q.id];let ix=arr.findIndex(x=>x==null);if(ix>=0)activeBlank=ix;else activeBlank=Math.min(q.blankCount-1,activeBlank+1);save();renderQuestion()}
function checkCurrent(){let q=questionAt();if(!completed(q)){toast('빈칸을 모두 채워 주세요.');return}state.session.checked[q.id]=true;save();renderQuestion()}
function finish(){const qs=sessionQs(),count=qs.filter(completed).length,unanswered=qs.length-count;if(unanswered&&!confirm(`아직 ${unanswered}문항의 답안이 완성되지 않았습니다. 미응답을 오답 처리하고 제출할까요?`))return;const sess=state.session;const outcomes=qs.map(q=>{const answer=userAns(q);const ok=completed(q)&&isCorrect(q,answer);const old=state.review[q.id]||{attempts:0,correct:0};state.review[q.id]={attempts:old.attempts+1,correct:old.correct+(ok?1:0),lastWrong:!ok};return{id:q.id,user:answer,correct:ok}});const correct=outcomes.filter(o=>o.correct).length;const result={ids:sess.ids,mode:sess.mode,description:sess.description,outcomes,correct,finishedAt:new Date().toISOString()};state.history.unshift({count:qs.length,correct,at:result.finishedAt,mode:sess.mode});state.history=state.history.slice(0,50);state.lastResult=result;state.session=null;save();showResult();window.scrollTo({top:0,behavior:'instant'})}
function resultItem(o,withMy=true){const q=qmap[o.id],answers=h(answerText(q));let mine=o.user.filter(x=>x!=null).length?o.user.map(v=>v==null?'(미입력)':optText(q,v)).join(' → '):'(미응답)';return `<div class="review-item"><div class="review-title"><span class="badge ${o.correct===null?'':o.correct?'mid':'vhard'}">${o.correct===null?'찜한 문제':o.correct?'정답':'오답'}</span> <span>${q.id}번 · ${h(smap[q.set].title)}</span> ${q.star?'<span style="color:#ac7d29">★</span>':''}</div><div class="review-statement">${h(q.text)}</div><div class="review-answers"><div class="answer">정답 · ${answers}</div>${withMy?`<div class="mine">내 답 · ${h(mine)}</div>`:''}</div>${DB.notes[q.id]?`<div class="feedback-note">${h(DB.notes[q.id])}</div>`:''}</div>`}
function showResult(){screen='result';chooseMode('result');const r=state.lastResult;if(!r){return home()}const pct=Math.round(r.correct/r.ids.length*100);const items=r.outcomes.filter(o=>reviewFilter==='all'||!o.correct);view.innerHTML=`<div class="result-hero"><div><div class="eyebrow" style="color:#afe3d7">STUDY REPORT</div><h1 style="font-size:26px;margin-bottom:8px">채점이 완료되었습니다</h1><div class="result-score">${r.correct}<span> / ${r.ids.length}문항</span></div><div class="result-sub">정답률 ${pct}% · 오답 ${r.ids.length-r.correct}문항 · ${h(r.description)}</div></div><div class="result-percent">${pct}%</div></div><div class="result-actions"><button class="btn btn-primary" data-action="restart-wrong" ${!r.outcomes.some(o=>!o.correct)?'disabled':''}>이번 오답 다시 풀기</button><button class="btn btn-outline" data-action="to-home">대시보드로</button><button class="btn btn-outline" data-action="new-exam">새 모의고사</button></div><div class="section-head"><div><h2>문항별 정답 확인</h2><p>정답지 기준이며, 특례 인정 기준이 적용되었습니다.</p></div></div><div class="toggle-filter"><button class="filter-btn ${reviewFilter==='wrong'?'active':''}" data-filter="wrong">오답만 (${r.ids.length-r.correct})</button><button class="filter-btn ${reviewFilter==='all'?'active':''}" data-filter="all">전체 보기 (${r.ids.length})</button></div><div class="review-list">${items.length?items.map(resultItem).join(''):'<div class="empty"><strong>복습할 오답이 없습니다.</strong><br>이번 학습의 모든 문항을 맞혔습니다.</div>'}</div>`}
function showCollection(which){screen=which;chooseMode(which);const ids=which==='wrong'?wrongIds():state.bookmarks.slice().sort((a,b)=>a-b);const title=which==='wrong'?'오답노트':'찜한 문제';view.innerHTML=`<div class="section-head" style="margin-top:2px"><div><div class="eyebrow">PERSONAL STUDY</div><h2>${title}</h2><p>${which==='wrong'?'최근 풀이에서 틀린 문제만 모았습니다. 다시 맞히면 오답 목록에서 사라집니다.':'중요한 문제를 별표로 모아 반복해서 풀 수 있습니다.'}</p></div></div>${ids.length?`<div class="setup-box" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px"><span><strong>${ids.length}문항</strong>이 있습니다.</span><button class="btn btn-primary" data-action="start-${which}">${title} ${ids.length}문항 풀기 →</button></div><div class="review-list">${ids.map(id=>resultItem({id,user:[],correct:which==='wrong'?false:null},false)).join('')}</div>`:`<div class="empty"><strong>${which==='wrong'?'아직 오답이 없습니다.':'아직 찜한 문제가 없습니다.'}</strong><br>${which==='wrong'?'먼저 문제를 풀고 결과를 제출해 주세요.':'문제를 풀면서 ☆ 버튼을 눌러 저장하세요.'}<br><button class="btn btn-primary" style="margin-top:15px" data-action="to-home">문제 풀러 가기 →</button></div>`}`}
function navigate(idx){const n=state.session.ids.length;currentIndex=Math.max(0,Math.min(n-1,idx));activeBlank=0;save();renderQuestion();window.scrollTo({top:0,behavior:'instant'})}
function handleClick(e){const btn=e.target.closest('button');if(!btn)return;const act=btn.dataset.action;
 if(btn.dataset.nav){const n=btn.dataset.nav;if(n==='home'||n==='practice'||n==='exam')home('all',n==='exam'?'exam':'practice');else showCollection(n);return}
 if(btn.dataset.sideSet){home(btn.dataset.sideSet);el('#setupSection')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(btn.dataset.set){home(btn.dataset.set);el('#setupSection')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(btn.dataset.blank!==undefined){setBlank(Number(btn.dataset.blank));return}
 if(btn.dataset.option){chooseOption(Number(btn.dataset.option));return}
 if(btn.dataset.index!==undefined){navigate(Number(btn.dataset.index));return}
 if(btn.dataset.filter){reviewFilter=btn.dataset.filter;showResult();return}
 if(act==='scroll-setup')el('#setupSection')?.scrollIntoView({behavior:'smooth'});
 else if(act==='wrong-screen')showCollection('wrong');
 else if(act==='start-practice'||act==='start-exam')startFromSetup(act==='start-exam'?'exam':'practice');
 else if(act==='resume'){currentIndex=0;let first=sessionQs().findIndex(q=>!completed(q));if(first>=0)currentIndex=first;renderQuestion()}
 else if(act==='to-home')home();
 else if(act==='prev')navigate(currentIndex-1);
 else if(act==='next'){if(currentIndex<state.session.ids.length-1)navigate(currentIndex+1);else toast('마지막 문제입니다. 완료 후 전체 채점 버튼을 누르세요.')}
 else if(act==='check')checkCurrent();
 else if(act==='finish')finish();
 else if(act==='bookmark'){const id=questionAt().id;if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();renderQuestion()}
 else if(act==='restart-wrong'){const wrong=state.lastResult.outcomes.filter(o=>!o.correct).map(o=>o.id);newSession(wrong,'practice','직전 시험 오답 복습')}
 else if(act==='new-exam')home('all','exam');
 else if(act==='start-wrong'||act==='start-bookmarks'){newSession(act==='start-wrong'?wrongIds():state.bookmarks.slice().sort((a,b)=>a-b),'practice',act==='start-wrong'?'오답 복습':'찜한 문제 복습')}
 else if(act==='reset'){if(confirm('풀이 기록, 오답노트, 찜한 문제를 모두 삭제할까요? 복구할 수 없습니다.')){state={history:[],review:{},bookmarks:[],session:null,lastResult:null};save();home();toast('브라우저의 학습 기록을 초기화했습니다.')}}
}
document.addEventListener('click',handleClick);el('#mobileHome').addEventListener('click',()=>home());document.addEventListener('keydown',e=>{if(screen!=='quiz'||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&currentIndex<state.session.ids.length-1)navigate(currentIndex+1);if(e.key==='ArrowLeft'&&currentIndex>0)navigate(currentIndex-1);if(e.key==='Backspace'&&document.activeElement===document.body){e.preventDefault();setBlank(activeBlank)}});
sidebar();home();
</script>
</body></html>
